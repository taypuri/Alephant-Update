<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="pricingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161616;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1e1e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#pricingGrad)" rx="8" />
  <circle cx="400" cy="400" r="200" fill="none" stroke="#ff4d00" stroke-width="1" stroke-opacity="0.1" />
  <circle cx="400" cy="400" r="150" fill="none" stroke="#ff4d00" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="400" cy="400" r="100" fill="none" stroke="#ff4d00" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="400" cy="400" r="50" fill="#ff4d00" fill-opacity="0.05" filter="url(#glow)" />
</svg>
